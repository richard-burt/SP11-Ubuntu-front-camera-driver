# SP11-voorcamera: libcamera's software-ISP draait GL via llvmpipe (de
# Adreno-GPU is onder deze kernel niet bruikbaar) en llvmpipe JIT't
# shadercode. MemoryDenyWriteExecute=yes laat die JIT segfaulten zodra een
# app de camera opent (PC in een niet-uitvoerbare JIT-pagina).
[Service]
MemoryDenyWriteExecute=no
