          ccm: [ 1.365, -0.306, -0.059,
                -0.270,  1.375, -0.105,
                -0.040, -0.370,  1.410 ]
        - ct: 6500
          ccm: [ 1.258, -0.257, -0.002,
                -0.245,  1.301, -0.055,
                 0.021, -0.598,  1.577 ]
  - Adjust:
      gamma: 2.8
